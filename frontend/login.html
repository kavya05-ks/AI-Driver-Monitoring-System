<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Driver - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f2f5f9;
        }

        .login-container {
            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 25px;
            color: #666;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;

            margin-top: 25px;
            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #1976d2;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca1;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register-link a {
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>AI Driver</h1>

    <p class="subtitle">
        Driver Login
    </p>


    <form id="loginForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div id="message"></div>


    <div class="register-link">

        Don't have an account?

        <a href="registration.html">Register</a>

    </div>


</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const message =
            document.getElementById("message");


        message.innerText = "Logging in...";


        try {

            const response = await fetch(
                "http://127.0.0.1:5000/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );


            if (!response.ok) {

                message.innerText =
                    "Server error: " + response.status;

                return;
            }


            const data =
                await response.json();


            if (data.success) {

                localStorage.setItem(
                    "username",
                    data.username
                );


                message.innerText =
                    "Login successful!";


                setTimeout(function() {

                    window.location.href = "dashboard.html";

                }, 500);

            }

            else {

                message.innerText =
                    data.message ||
                    "Invalid username or password";

            }


        }

        catch (error) {

            console.error(
                "Connection error:",
                error
            );


            message.innerText =
                "Cannot connect to server.";

        }

    });

</script>


</body>

</html>
