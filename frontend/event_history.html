<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Driver Event History</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .card p {
            color: #666;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #222;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .high {
            color: #d00000;
            font-weight: bold;
        }

        .medium {
            color: #e67e00;
            font-weight: bold;
        }

        .low {
            color: #008000;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #d00000;
        }

        @media (max-width: 700px) {

            .summary {
                flex-direction: column;
            }

            body {
                padding: 15px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>AI Driver Event History</h1>

    <p class="subtitle">
        Driver Safety Monitoring Events
    </p>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="card">

            <h2 id="totalEvents">
                0
            </h2>

            <p>
                Total Events
            </p>

        </div>


        <div class="card">

            <h2 id="highEvents">
                0
            </h2>

            <p>
                High Severity
            </p>

        </div>


        <div class="card">

            <h2 id="mediumEvents">
                0
            </h2>

            <p>
                Medium Severity
            </p>

        </div>

    </div>


    <!-- EVENT TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Event</th>

                    <th>Severity</th>

                    <th>Date & Time</th>

                </tr>

            </thead>


            <tbody id="eventTable">

                <tr>

                    <td colspan="4"
                        class="loading">

                        Loading events...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

async function loadEvents() {

    const table =
        document.getElementById("eventTable");

    const username =
        localStorage.getItem("username");

    if (!username) {

        window.location.href = "login.html";
        return;

    }

    try {

        const response =
            await fetch(
                "http://127.0.0.1:5000/api/events?username="
                + encodeURIComponent(username)
            );


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        const events =
            data.events || [];


        // =====================================
        // SUMMARY
        // =====================================

        document.getElementById(
            "totalEvents"
        ).textContent =
            events.length;


        const highCount =
            events.filter(
                event =>
                    event.severity === "HIGH"
            ).length;


        const mediumCount =
            events.filter(
                event =>
                    event.severity === "MEDIUM"
            ).length;


        document.getElementById(
            "highEvents"
        ).textContent =
            highCount;


        document.getElementById(
            "mediumEvents"
        ).textContent =
            mediumCount;


        // =====================================
        // NO EVENTS
        // =====================================

        if (events.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="4"
                        class="loading">
                        No events found.
                    </td>
                </tr>
            `;

            return;
        }


        // =====================================
        // DISPLAY EVENTS
        // =====================================

        table.innerHTML = "";


        events.forEach(event => {

            const row =
                document.createElement("tr");


            let severityClass =
                event.severity
                    .toLowerCase();


            row.innerHTML = `

                <td>
                    ${event.id}
                </td>

                <td>
                    ${event.event_type}
                </td>

                <td class="${severityClass}">
                    ${event.severity}
                </td>

                <td>
                    ${event.timestamp}
                </td>

            `;


            table.appendChild(row);

        });


    }

    catch (error) {

        console.error(error);


        table.innerHTML = `

            <tr>

                <td colspan="4"
                    class="error">

                    Unable to load events.
                    <br>
                    Make sure the Flask Event API
                    is running.

                </td>

            </tr>

        `;

    }

}


// Load events when page opens

loadEvents();

</script>


</body>

</html>
